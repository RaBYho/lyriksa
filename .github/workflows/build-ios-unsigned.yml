name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios-unsigned:
    name: Build Unsigned iOS (.ipa)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project (Expo Prebuild)
        env:
          CI: '1'
        run: |
          npx expo prebuild --platform ios --clean
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

      - name: Archive Release iOS build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Archiving workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/lyriksa.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/lyriksa.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found in archive"
            exit 1
          fi
          ls -la "$APP_PATH"
          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "Error: main.jsbundle missing inside .app bundle"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa_build/Payload"
          cp -a "$APP_PATH" "$RUNNER_TEMP/ipa_build/Payload/"
          cd "$RUNNER_TEMP/ipa_build"
          zip -qry "$GITHUB_WORKSPACE/Lyriksa-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/Lyriksa-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyriksa-unsigned-ipa
          path: Lyriksa-unsigned.ipa
          retention-days: 30
