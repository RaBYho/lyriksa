name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (Expo Prebuild)
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Verify and package APK
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          ls -lh "$APK_DIR"
          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found in $APK_DIR"
            exit 1
          fi
          cp "$APK_PATH" "$GITHUB_WORKSPACE/Lyriksa.apk"
          ls -lh "$GITHUB_WORKSPACE/Lyriksa.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyriksa-android-apk
          path: Lyriksa.apk
          retention-days: 30
